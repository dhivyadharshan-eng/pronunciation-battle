<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Battle • Polyglot</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><a class="brand" href="#"><img src="assets/polyglot-logo.jpg"><span>POLYGLOT<small>PRONUNCIATION BATTLE</small></span></a><div class="connection"><i id="onlineDot"></i><span id="connectionText">Online</span></div></header><main class="battle-shell"><section class="battle-meta"><div><span class="eyebrow">LIVE BATTLE</span><h1 id="teamTitle">Team</h1></div><div class="round-pill">Round <b id="roundNumber">1</b> / 5</div></section><div class="progress"><span id="progressBar"></span></div><section class="glass-card battle-card"><div class="battle-top"><span id="difficulty" class="badge">Easy</span><span>Attempts <b id="attemptText">0</b> / 3</span></div><div class="speaker">🎙️<small id="speakerName">Speaker</small></div><p class="instruction">Read the sentence clearly and naturally.</p><div class="sentence" id="sentence">Loading sentence…</div><div class="wave"><span></span><span></span><span></span><span></span><span></span></div><button id="micBtn" class="mic" type="button">🎙️<small>Tap to speak</small></button><div class="result-panel"><span>Recognized speech</span><strong id="recognizedText">—</strong><div class="score-line"><span>Accuracy</span><b id="score">—</b></div></div><div class="actions"><button id="retryBtn" class="secondary" type="button" disabled>Retry <span id="retryCount">0</span>/3</button><button id="nextBtn" class="primary" type="button" disabled>Continue →</button></div><p id="battleMsg" class="status"></p></section></main><script type="module" src="js/battle.js"></script></body></html>
